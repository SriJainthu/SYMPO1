<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aesthetic Dragon Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    #intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      z-index: 9999;
      transition: opacity 1s ease-out, visibility 1s;
    }

    #intro-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Blurred backdrop copy fills the whole screen, no awkward crop feel */
    #dragon-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(30px) brightness(0.6) saturate(1.2);
      transform: scale(1.15); /* hides blur edge artifacts */
    }

    /* Sharp foreground video, centered, full width, no cropping */
    #dragon-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: contain;
    }

    @media (orientation: landscape) {
      #dragon-video {
        width: auto;
        height: 100%;
      }
    }

    .hidden { opacity: 0; transition: opacity 1s ease-in; }
    .visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="intro-overlay">
    <video id="dragon-video-bg" muted loop playsinline aria-hidden="true">
      <source src="dragon_intro.mp4" type="video/mp4">
    </video>
    <video id="dragon-video" playsinline>
      <source src="dragon_intro.mp4" type="video/mp4">
      <source src="dragon_intro.webm" type="video/webm">
    </video>
  </div>

  <main id="main-content" class="hidden">
    <header>
      <h1>Welcome to the Symposium</h1>
    </header>
  </main>

  <script>
    const dragonVideo = document.getElementById('dragon-video');
    const dragonVideoBg = document.getElementById('dragon-video-bg');
    const introOverlay = document.getElementById('intro-overlay');
    const mainContent = document.getElementById('main-content');

    // Keep the blurred backdrop in sync with the main video
    dragonVideo.addEventListener('play', () => dragonVideoBg.play());

    dragonVideo.muted = false;
    dragonVideo.play().catch(() => {
      dragonVideo.muted = true;
      dragonVideo.play();
    });

    const enableAudio = () => {
      dragonVideo.muted = false;
      document.removeEventListener('click', enableAudio);
      document.removeEventListener('touchstart', enableAudio);
    };
    document.addEventListener('click', enableAudio);
    document.addEventListener('touchstart', enableAudio);

    dragonVideo.addEventListener('ended', () => {
      introOverlay.classList.add('fade-out');
      mainContent.classList.remove('hidden');
      mainContent.classList.add('visible');
      setTimeout(() => { introOverlay.style.display = 'none'; }, 1000);
    });
  </script>
</body>
</html>
