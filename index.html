<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aesthetic Dragon Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    #intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      z-index: 9999;
      transition: opacity 1s ease-out, visibility 1s;
    }

    #intro-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    #dragon-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(50px) brightness(0.55) saturate(1.3);
      transform: scale(1.3);
    }

    #dragon-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: contain;
      -webkit-mask-image: linear-gradient(
        to bottom, transparent 0%, black 12%, black 88%, transparent 100%
      );
      mask-image: linear-gradient(
        to bottom, transparent 0%, black 12%, black 88%, transparent 100%
      );
    }

    @media (orientation: landscape) {
      #dragon-video { width: auto; height: 100%; }
    }

    #ember-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 1;
    }

    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%
      );
      z-index: 2;
    }

    #tap-to-enter {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.75);
      cursor: pointer;
      transition: opacity 0.5s ease;
    }
    #tap-to-enter.hide {
      opacity: 0;
      pointer-events: none;
    }
    #tap-to-enter .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 190, 110, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    #tap-to-enter .icon svg {
      width: 26px;
      height: 26px;
      fill: rgba(255, 210, 150, 0.95);
    }
    #tap-to-enter p {
      color: rgba(255, 220, 180, 0.9);
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,150,60,0.4); }
      50% { box-shadow: 0 0 0 14px rgba(255,150,60,0); }
    }

    .hidden { opacity: 0; transition: opacity 1s ease-in; }
    .visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="intro-overlay">
    <video id="dragon-video-bg" muted loop playsinline aria-hidden="true">
      <source src="dragon_intro.mp4" type="video/mp4">
    </video>
    <video id="dragon-video" playsinline muted preload="auto">
      <source src="dragon_intro.mp4" type="video/mp4">
      <source src="dragon_intro.webm" type="video/webm">
    </video>
    <canvas id="ember-canvas"></canvas>
    <div id="vignette"></div>

    <div id="tap-to-enter">
      <div class="icon">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
      <p>Tap to enter with sound</p>
    </div>
  </div>

  <main id="main-content" class="hidden">
    <header>
      <h1>Welcome to the Symposium</h1>
    </header>
  </main>

  <script>
    const dragonVideo = document.getElementById('dragon-video');
    const dragonVideoBg = document.getElementById('dragon-video-bg');
    const introOverlay = document.getElementById('intro-overlay');
    const mainContent = document.getElementById('main-content');
    const tapToEnter = document.getElementById('tap-to-enter');

    let hasEntered = false; // guards against the 'ended' listener firing early

    // Prime the video for mobile (forces buffering) WITHOUT letting it
    // play through to completion before the user taps.
    dragonVideo.play().then(() => {
      dragonVideo.pause();
      dragonVideo.currentTime = 0;
    }).catch(() => {
      // Some browsers block even muted play until interaction — that's fine,
      // the tap-to-enter flow below still works.
    });

    dragonVideoBg.play().catch(() => {});

    dragonVideo.addEventListener('timeupdate', () => {
      if (Math.abs(dragonVideoBg.currentTime - dragonVideo.currentTime) > 0.15) {
        dragonVideoBg.currentTime = dragonVideo.currentTime;
      }
    });

    function enterWithSound() {
     e.preventDefault();
      hasEntered = true;
      dragonVideo.muted = false;
      dragonVideo.currentTime = 0;
      dragonVideo.play();
      tapToEnter.classList.add('hide');
      setTimeout(() => { tapToEnter.style.display = 'none'; }, 500);
    }
    tapToEnter.addEventListener('touchstart', enterWithSound, { passive: false });
    tapToEnter.addEventListener('click', enterWithSound);
    tapToEnter.addEventListener('touchstart', enterWithSound);

    // Only fade to main content once the REAL (post-tap) playback ends
    dragonVideo.addEventListener('ended', () => {
      if (!hasEntered) return; // ignore the silent priming pass, if it ever fires
      introOverlay.classList.add('fade-out');
      mainContent.classList.remove('hidden');
      mainContent.classList.add('visible');
      setTimeout(() => { introOverlay.style.display = 'none'; }, 1000);
    });

    /* ---------------- Realistic Omnidirectional Ember System ---------------- */
    const canvas = document.getElementById('ember-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function rand(min, max) { return Math.random() * (max - min) + min; }

    const hotColors  = ['255,235,180', '255,215,130'];
    const midColors  = ['255,160,60', '255,130,40'];
    const coolColors = ['220,80,30', '180,50,20'];

    function pickColor(heat) {
      if (heat > 0.66) return hotColors[Math.floor(rand(0, hotColors.length))];
      if (heat > 0.33) return midColors[Math.floor(rand(0, midColors.length))];
      return coolColors[Math.floor(rand(0, coolColors.length))];
    }

    function createParticle() {
      const isBigEmber = Math.random() < 0.25;
      const size = isBigEmber ? rand(2.2, 4.5) : rand(0.6, 1.8);
      const heat = rand(0.5, 1);

      // Base direction: mostly upward drift like rising heat, but with real
      // variance — some particles drift sideways or even sink slightly,
      // like ash caught in shifting air currents rather than a single stream.
      const baseAngle = rand(-100, -80) * (Math.PI / 180); // roughly upward
      const angleSpread = rand(-1.1, 1.1); // wide variance around that direction
      const speed = isBigEmber ? rand(0.3, 0.9) : rand(0.5, 1.8);

      return {
        x: rand(0, canvas.width),
        y: rand(0, canvas.height),
        size,
        vx: Math.cos(baseAngle + angleSpread) * speed,
        vy: Math.sin(baseAngle + angleSpread) * speed,
        turbPhase: rand(0, Math.PI * 2),
        turbSpeed: rand(0.015, 0.045),
        turbulence: rand(0.3, 1.3),
        heat,
        opacity: rand(0.6, 1),
        flicker: rand(0.02, 0.08),
        isBigEmber,
        driftHistory: 0,
        trail: isBigEmber ? rand(3, 7) : 0,
        life: 1,
        decay: rand(0.002, 0.005)
      };
    }

    const PARTICLE_COUNT = 90;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      particles.push(createParticle());
    }

    function colorStr(rgb, alpha) {
      return `rgba(${rgb},${alpha})`;
    }

    function drawParticle(p) {
      const rgb = pickColor(p.heat);
      const alpha = p.opacity * p.life;

      if (p.isBigEmber && p.trail > 0) {
        const gradTrail = ctx.createLinearGradient(
          p.x, p.y, p.x - p.driftHistory * 3, p.y - p.vy * 3
        );
        gradTrail.addColorStop(0, colorStr(rgb, alpha * 0.5));
        gradTrail.addColorStop(1, colorStr(rgb, 0));
        ctx.strokeStyle = gradTrail;
        ctx.lineWidth = p.size * 0.6;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.driftHistory * 3, p.y - p.vy * 3);
        ctx.stroke();
      }

      const glowSize = p.size * (p.isBigEmber ? 5 : 3.2);
      const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
      gradient.addColorStop(0, colorStr(rgb, alpha));
      gradient.addColorStop(0.35, colorStr(rgb, alpha * 0.35));
      gradient.addColorStop(1, colorStr(rgb, 0));
      ctx.beginPath();
      ctx.fillStyle = gradient;
      ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = colorStr(rgb, Math.min(1, alpha * 1.3));
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    function updateParticle(p) {
      p.turbPhase += p.turbSpeed;

      // Turbulent sideways sway layered on top of the base velocity —
      // this is what makes it feel like real air movement instead of
      // a straight line in one direction.
      const swayX = Math.sin(p.turbPhase) * p.turbulence * 0.3;
      const swayY = Math.cos(p.turbPhase * 0.7) * p.turbulence * 0.15;

      const prevX = p.x;
      p.x += p.vx + swayX;
      p.y += p.vy + swayY;
      p.driftHistory = p.x - prevX;

      p.heat = Math.max(0, p.heat - 0.001);
      p.opacity += (Math.random() - 0.5) * p.flicker;
      p.opacity = Math.max(0.3, Math.min(1, p.opacity));
      p.life -= p.decay;

      // Wrap around ALL edges instead of only respawning from the bottom —
      // particles can drift off any side and reappear on the opposite side,
      // matching how scattered ash moves through a real scene.
      if (p.x < -20) p.x = canvas.width + 20;
      if (p.x > canvas.width + 20) p.x = -20;
      if (p.y < -20) p.y = canvas.height + 20;
      if (p.y > canvas.height + 20) p.y = -20;

      if (p.life <= 0) {
        Object.assign(p, createParticle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        updateParticle(p);
        drawParticle(p);
      });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
