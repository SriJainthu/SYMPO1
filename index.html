<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Aesthetic Dragon Website</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0b0c10;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
    }

    #intro-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
      z-index: 9999;
      transition: opacity 1s ease-out, visibility 1s;
    }

    #intro-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    /* Blurred backdrop — fills screen, heavily blurred + darkened */
    #dragon-video-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(50px) brightness(0.55) saturate(1.3);
      transform: scale(1.3); /* hides blur edge artifacts, pulls in more glow */
    }

    /* Sharp foreground video */
    #dragon-video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: contain;

      /* KEY FIX: fade top/bottom edges to transparent so it blends
         into the blurred background instead of a hard cut line */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 12%,
        black 88%,
        transparent 100%
      );
    }

    @media (orientation: landscape) {
      #dragon-video {
        width: auto;
        height: 100%;
      }
    }

    /* Extra vignette to help hide any remaining seam and add mood */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        transparent 40%,
        rgba(0,0,0,0.55) 100%
      );
    }

    .hidden { opacity: 0; transition: opacity 1s ease-in; }
    .visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="intro-overlay">
    <video id="dragon-video-bg" muted loop playsinline aria-hidden="true">
      <source src="dragon_intro.mp4" type="video/mp4">
    </video>
    <video id="dragon-video" playsinline>
      <source src="dragon_intro.mp4" type="video/mp4">
      <source src="dragon_intro.webm" type="video/webm">
    </video>
    <div id="vignette"></div>
  </div>

  <main id="main-content" class="hidden">
    <header>
      <h1>Welcome to the Symposium</h1>
    </header>
  </main>

  <script>
    const dragonVideo = document.getElementById('dragon-video');
    const dragonVideoBg = document.getElementById('dragon-video-bg');
    const introOverlay = document.getElementById('intro-overlay');
    const mainContent = document.getElementById('main-content');

    dragonVideo.muted = false;
    dragonVideo.play().catch(() => {
      dragonVideo.muted = true;
      dragonVideo.play();
    });
    dragonVideoBg.play();

    // Keep bg video frame-synced to foreground video
    // so the blur always matches the visible action
    dragonVideo.addEventListener('timeupdate', () => {
      if (Math.abs(dragonVideoBg.currentTime - dragonVideo.currentTime) > 0.15) {
        dragonVideoBg.currentTime = dragonVideo.currentTime;
      }
    });

    const enableAudio = () => {
      dragonVideo.muted = false;
      document.removeEventListener('click', enableAudio);
      document.removeEventListener('touchstart', enableAudio);
    };
    document.addEventListener('click', enableAudio);
    document.addEventListener('touchstart', enableAudio);

    dragonVideo.addEventListener('ended', () => {
      introOverlay.classList.add('fade-out');
      mainContent.classList.remove('hidden');
      mainContent.classList.add('visible');
      setTimeout(() => { introOverlay.style.display = 'none'; }, 1000);
    });
  </script>
</body>
</html>
